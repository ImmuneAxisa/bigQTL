name: Auto-document

on:
  pull_request:
    branches: [main, master]

jobs:
  document:
    runs-on: ubuntu-latest

    # Needs write access to push the commit back to the PR branch
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the PR head branch so we can push back to it
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools
          needs: check

      - name: Run devtools::document()
        shell: Rscript {0}
        run: devtools::document()

      - name: Commit and push documentation changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add man/ NAMESPACE
          git diff --cached --quiet || git commit -m "chore: auto-update documentation [skip ci]"
          git push
