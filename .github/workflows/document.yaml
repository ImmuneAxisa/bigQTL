name: Auto-document

# This workflow can be triggered manually from the GitHub Actions UI to
# regenerate man/ and NAMESPACE on any branch.
#
# Automatic documentation on pull requests is handled by the `document` job
# inside R-CMD-check.yaml, which runs as a prerequisite to R CMD check so
# that both steps are properly ordered within the same workflow run.
on:
  workflow_dispatch:

jobs:
  document:
    runs-on: ubuntu-latest

    # Needs write access to push the commit back to the branch
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools
          needs: check

      - name: Run devtools::document()
        shell: Rscript {0}
        run: devtools::document()

      - name: Commit and push documentation changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add man/ NAMESPACE
          git diff --cached --quiet || git commit -m "chore: auto-update documentation [skip ci]"
          git push
